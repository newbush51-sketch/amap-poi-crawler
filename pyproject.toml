[project]
name = "amap-poi-crawler"
version = "1.0.0"
description = "Resume-safe AMap POI crawler with grid splitting and API-key rotation"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "newbush51-sketch" }]
keywords = ["amap", "poi", "gis", "crawler", "gcj02", "wgs84"]

[project.scripts]
amap-poi-crawler = "amap_poi_crawler:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["amap_poi_crawler"]

